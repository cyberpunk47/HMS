server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: any unknown path still returns index.html, the router decides.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Lets the load test (and a monitoring check) confirm the frontend is alive
    # without downloading the whole page.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
