#cloud-config
# Runs once, automatically, the first time the Jenkins machine boots.
# Installs: Java 21, Jenkins, Docker, kubectl, helm, terraform, AWS CLI, Node 20, git.
# Then writes a Jenkins "configuration as code" file so both pipeline jobs already
# exist the first time you open the UI — no plugin wizard, no clicking.
#
# NOTE: Terraform renders this file with templatefile(), so a dollar-brace pair is
# read as a Terraform variable. Only these five are real variables here:
# admin_password, repo_url, region, cluster_name, project. Anything else that needs
# a literal dollar-brace must be written with two dollar signs.

package_update: true

write_files:
  - path: /etc/jenkins-casc/jenkins.yaml
    permissions: "0640"
    content: |
      jenkins:
        systemMessage: "HMS DevOps controller - created by Terraform, configured by JCasC"
        numExecutors: 2
        securityRealm:
          local:
            allowsSignup: false
            users:
              - id: "admin"
                password: "${admin_password}"
        authorizationStrategy:
          loggedInAuthenticationStrategy:
            allowAnonymousRead: false
      unclassified:
        location:
          adminAddress: "admin@hms.local"
      jobs:
        - script: >
            pipelineJob('hms-platform') {
              description('Creates the EKS cluster, installs the platform tools, builds and deploys HMS. Run this first.')
              definition {
                cpsScm {
                  scm {
                    git {
                      remote { url('${repo_url}') }
                      branch('*/main')
                    }
                  }
                  scriptPath('jenkins/Jenkinsfile.platform')
                }
              }
            }
        - script: >
            pipelineJob('hms-loadtest') {
              description('Fires traffic at the public URL with k6 and shows the pods scaling. Run this during the demo.')
              definition {
                cpsScm {
                  scm {
                    git {
                      remote { url('${repo_url}') }
                      branch('*/main')
                    }
                  }
                  scriptPath('jenkins/Jenkinsfile.loadtest')
                }
              }
            }
        - script: >
            pipelineJob('hms-destroy') {
              description('Deletes the EKS cluster and its load balancers so the bill stops. Jenkins survives.')
              definition {
                cpsScm {
                  scm {
                    git {
                      remote { url('${repo_url}') }
                      branch('*/main')
                    }
                  }
                  scriptPath('jenkins/Jenkinsfile.destroy')
                }
              }
            }

  - path: /etc/jenkins-casc/plugins.txt
    content: |
      configuration-as-code
      job-dsl
      workflow-aggregator
      git
      credentials-binding
      pipeline-stage-view
      timestamper
      ws-cleanup
      ansicolor

  - path: /etc/profile.d/hms.sh
    content: |
      export AWS_DEFAULT_REGION=${region}
      export HMS_CLUSTER_NAME=${cluster_name}
      export HMS_PROJECT=${project}

runcmd:
  # ---------- base packages ----------
  # DPkg::Lock::Timeout waits instead of failing when Ubuntu's own unattended-upgrade
  # happens to hold the package lock at boot.
  - DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 update -y
  - DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 install -y ca-certificates curl gnupg unzip git jq fontconfig openjdk-21-jre docker.io

  # ---------- Jenkins ----------
  # The signing key is versioned by year and Jenkins rotates it (2023 -> 2026), so a
  # stale URL 404s, the keyring ends up empty, apt calls the repo unsigned and the
  # install fails quietly. The guard below makes that failure loud instead: if the key
  # is missing or empty, stop here rather than running 20 more steps that all depend
  # on Jenkins existing.
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key -o /etc/apt/keyrings/jenkins-keyring.asc
  - test -s /etc/apt/keyrings/jenkins-keyring.asc || { echo "FATAL: Jenkins signing key download failed - check https://www.jenkins.io/doc/book/installing/linux/ for the current key filename"; exit 1; }
  - echo "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/" > /etc/apt/sources.list.d/jenkins.list
  - DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 update -y
  - DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 install -y jenkins
  - test -f /usr/share/java/jenkins.war || { echo "FATAL: jenkins package did not install"; exit 1; }

  # ---------- kubectl ----------
  - curl -fsSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
  - chmod +x /usr/local/bin/kubectl

  # ---------- helm ----------
  - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 -o /tmp/get-helm.sh
  - bash /tmp/get-helm.sh

  # ---------- terraform ----------
  - curl -fsSL https://apt.releases.hashicorp.com/gpg -o /tmp/hashicorp.gpg
  - gpg --dearmor -o /usr/share/keyrings/hashicorp.gpg /tmp/hashicorp.gpg
  - echo "deb [signed-by=/usr/share/keyrings/hashicorp.gpg] https://apt.releases.hashicorp.com noble main" > /etc/apt/sources.list.d/hashicorp.list
  - DEBIAN_FRONTEND=noninteractive apt-get update -y
  - DEBIAN_FRONTEND=noninteractive apt-get install -y terraform

  # ---------- AWS CLI v2 ----------
  - curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
  - unzip -q /tmp/awscliv2.zip -d /tmp
  - /tmp/aws/install

  # ---------- Node 20 (the data seeding script runs on it) ----------
  - curl -fsSL https://deb.nodesource.com/setup_20.x -o /tmp/node.sh
  - bash /tmp/node.sh
  - DEBIAN_FRONTEND=noninteractive apt-get install -y nodejs

  # ---------- let Jenkins build images ----------
  - usermod -aG docker jenkins
  - systemctl enable --now docker

  # ---------- Jenkins plugins + config-as-code ----------
  - curl -fsSL https://github.com/jenkinsci/plugin-installation-manager-tool/releases/download/2.13.2/jenkins-plugin-manager-2.13.2.jar -o /opt/jenkins-plugin-manager.jar
  - java -jar /opt/jenkins-plugin-manager.jar --war /usr/share/java/jenkins.war --plugin-file /etc/jenkins-casc/plugins.txt --plugin-download-directory /var/lib/jenkins/plugins
  - chown -R jenkins:jenkins /var/lib/jenkins/plugins /etc/jenkins-casc
  - mkdir -p /etc/systemd/system/jenkins.service.d
  - printf '[Service]\nEnvironment="JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Dcasc.jenkins.config=/etc/jenkins-casc/jenkins.yaml"\nEnvironment="AWS_DEFAULT_REGION=${region}"\nEnvironment="HMS_CLUSTER_NAME=${cluster_name}"\n' > /etc/systemd/system/jenkins.service.d/override.conf
  - systemctl daemon-reload
  - systemctl enable --now jenkins
  - systemctl restart jenkins

final_message: "Jenkins is ready after $UPTIME seconds. Open http://<public-ip>:8080"
