###############################################################################
# ingress-nginx on minikube.
#
# Difference from the AWS file: no cloud load balancer exists here, so the
# controller is published on a fixed NodePort and reached at
# http://$(minikube ip):30080 . Everything else, including metrics.enabled, is
# the same.
#
# metrics.enabled gives you 24 nginx_ metric lines and they are ALL
# process-level: nginx_ingress_controller_nginx_process_requests_total,
# _connections, _cpu_seconds_total, plus build/config/ssl info. This build
# publishes no per-ingress counter, so nginx_ingress_controller_requests - the
# metric most KEDA examples on the internet use - does not exist here. KEDA
# scales on the process counter instead; see k8s/40-autoscaling.yaml.
###############################################################################
controller:
  replicaCount: 1
  nodeSelector:
    role: app

  service:
    type: NodePort
    nodePorts:
      http: 30080
      https: 30443

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack

  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "700m", memory: "320Mi" }

  config:
    worker-processes: "2"
    keep-alive-requests: "10000"
    upstream-keepalive-connections: "256"

  # A single-node cluster has no second node to spread across, so the default
  # anti-affinity rule would leave the pod Pending forever.
  admissionWebhooks:
    enabled: false
