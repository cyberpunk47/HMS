###############################################################################
# Prometheus + Grafana on minikube.
#
# Same two settings that matter on AWS:
#   remote-write-receiver                  -> lets k6 push its own metrics in
#   serviceMonitorSelectorNilUsesHelmValues -> lets Prometheus see our ServiceMonitor
#
# Sized for a laptop: shorter retention, smaller requests, and Grafana on a fixed
# NodePort instead of a cloud load balancer.
###############################################################################
prometheus:
  # Published on a fixed NodePort so k6 can push its metrics straight in
  # (no port-forward to keep alive during a load test).
  service:
    type: NodePort
    nodePort: 30090
  prometheusSpec:
    # k6 pushes its own metrics in over the remote-write protocol. This used to
    # be a Prometheus feature flag ("enableFeatures: [remote-write-receiver]");
    # since Prometheus 3.x it is a server flag of its own, and an unrecognised
    # feature name is ignored silently - /api/v1/write then 404s and k6 logs
    # "got status code: 404" for the whole run while the dashboard shows No data.
    enableRemoteWriteReceiver: true
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 2h
    scrapeInterval: 15s
    resources:
      # Headroom for the load test: k6 remote-writes a trend metric per endpoint
      # per rate, which is a lot of new series arriving in a few minutes on top
      # of the normal scrape load. 1Gi was tight before that traffic existed.
      requests: { cpu: "100m", memory: "512Mi" }
      limits: { cpu: "1500m", memory: "2Gi" }
    nodeSelector:
      role: app

grafana:
  # Local-only cluster on your own laptop, so a memorable password is fine here.
  # The AWS values file generates a random one instead.
  adminPassword: "admin"
  nodeSelector:
    role: app
  service:
    type: NodePort
    nodePort: 30030
  resources:
    # 256Mi was wrong and it showed: Grafana sat at ~146Mi idle, then every time
    # the HMS dashboard was opened the range queries pushed it over the limit and
    # the kernel killed it - 16 OOMKills, exit 137, and the browser got
    # ERR_EMPTY_RESPONSE because the pod died mid-request. A dashboard with eight
    # panels is the normal case here, not a peak, so the limit has to cover it.
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "800m", memory: "768Mi" }
  defaultDashboardsEnabled: false # the stock dashboards are noise for this demo
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  grafana.ini:
    users:
      default_theme: light

alertmanager:
  enabled: false

# minikube runs the control plane as static pods that these jobs cannot scrape,
# so leaving them on would show permanently red targets.
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeEtcd: { enabled: false }
kubeProxy: { enabled: false }

nodeExporter:
  enabled: true
kubeStateMetrics:
  enabled: true
