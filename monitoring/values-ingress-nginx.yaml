###############################################################################
# Helm values for ingress-nginx — the public door, and also the component that
# counts the traffic KEDA scales on.
#
# metrics.enabled + serviceMonitor is what produces nginx_ingress_controller_requests,
# the metric the gateway's autoscaler reads. Turn these off and nothing scales.
###############################################################################
controller:
  replicaCount: 2
  nodeSelector:
    role: app

  service:
    type: LoadBalancer
    annotations:
      # Network Load Balancer: cheaper and faster than the classic one, and it
      # passes traffic through at layer 4 so the latency we measure is the
      # application's, not the balancer's.
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack

  resources:
    requests: { cpu: "300m", memory: "256Mi" }
    limits: { cpu: "1500m", memory: "512Mi" }

  config:
    # The load test opens many short-lived connections; the defaults are tuned
    # for browsers, not for 5000 requests a second.
    worker-processes: "auto"
    keep-alive-requests: "10000"
    upstream-keepalive-connections: "512"
    use-forwarded-headers: "true"
