spring.application.name=PharmacyMS
server.port=9300

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/hms_pharmacy_db
spring.datasource.username=postgres
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.output.ansi.enabled=always

MEDICINE_ALREADY_EXISTS=Medicine already exists.
MEDICINE_NOT_FOUND=Medicine not found.
SALES_ALREADY_EXISTS=Sales record already exists.
SALE_NOT_FOUND=Sale not found.
INVENTORY_NOT_FOUND=Inventory not found.
OUT_OF_STOCK=Medicine is out of stock.
INSUFFICIENT_STOCK=Insufficient stock available.
SALE_ITEMS_REQUIRED=At least one sale item is required.

# ===========================
# Swagger / OpenAPI (temporary, for API discovery during benchmarking)
# Off by default. Enable with env SWAGGER_ENABLED=true, then open
# http://<host>:<service-port>/swagger-ui.html  (JSON: /v3/api-docs)
# ===========================
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# ===========================
# Actuator (benchmark observability: /actuator/metrics/hikaricp.connections.active etc.)
# Protected by the same X-Secret-Key rule as every other path of this service.
# ===========================
management.endpoints.web.exposure.include=health,info,metrics
