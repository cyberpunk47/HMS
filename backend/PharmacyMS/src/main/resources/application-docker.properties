spring.datasource.url=jdbc:postgresql://postgres:5432/hms_pharmacy_db
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka

# Benchmark hygiene: SQL statement logging is very high volume under load.
# (Re-enable locally with SPRING_JPA_SHOW_SQL=true if needed.)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
