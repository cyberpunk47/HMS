spring.application.name=GatewayMS
server.port=9000

spring.output.ansi.enabled=always

# JWT signing secret: MUST be the same value as UserMS, and DIFFERENT per environment
# (local / AWS), so a token issued in one environment is rejected by the others.
# Generate: openssl rand -base64 64   (the Gateway refuses to start without a valid secret)
hms.jwt.secret=${JWT_SECRET:}


spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin RETAIN_UNIQUE

spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowedOrigins=${FRONTEND_URL:http://localhost:5173}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true

#UserMS
spring.cloud.gateway.server.webflux.routes[0].id=UserMS
spring.cloud.gateway.server.webflux.routes[0].uri=lb://UserMS
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/user/**, /users/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=TokenFilter


#ProfileMS
spring.cloud.gateway.server.webflux.routes[1].id=ProfileMS
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ProfileMS
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/profile/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=TokenFilter


#AppointmentMS
spring.cloud.gateway.server.webflux.routes[2].id=AppointmentMS
spring.cloud.gateway.server.webflux.routes[2].uri=lb://AppointmentMS
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/appointment/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=TokenFilter


#PharmacyMS
spring.cloud.gateway.server.webflux.routes[3].id=PharmacyMS
spring.cloud.gateway.server.webflux.routes[3].uri=lb://PharmacyMS
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/pharmacy/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=TokenFilter


#NotificationMS
spring.cloud.gateway.server.webflux.routes[4].id=NotificationMS
spring.cloud.gateway.server.webflux.routes[4].uri=lb://NotificationMS
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/notification/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=TokenFilter

# Actuator: /actuator/health backs the Kubernetes readiness and liveness
# probes; /actuator/prometheus is what Prometheus scrapes.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
