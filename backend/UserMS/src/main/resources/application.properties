spring.application.name=UserMS
server.port=8082
spring.datasource.url=jdbc:postgresql://localhost:5432/hms_user_db
spring.datasource.username=postgres
spring.datasource.password=admin123
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


USER_ALREADY_EXISTS=User already exists.
USER_NOT_FOUND=User not found.
INVALID_CREDENTIALS=Invalid credentials. 

# JWT signing secret: same value as the Gateway, DIFFERENT per environment (local / AWS).
# Generate: openssl rand -base64 64   (UserMS refuses to start without a valid secret)
hms.jwt.secret=${JWT_SECRET:}

spring.output.ansi.enabled=always

# ===========================
# Swagger / OpenAPI (temporary, for API discovery during benchmarking)
# Off by default. Enable with env SWAGGER_ENABLED=true, then open
# http://<host>:<service-port>/swagger-ui.html  (JSON: /v3/api-docs)
# ===========================
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# ===========================
# Actuator (benchmark observability: /actuator/metrics/hikaricp.connections.active etc.)
# Protected by the same X-Secret-Key rule as every other path of this service.
# ===========================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
