spring.application.name=ProfileMS

server.port=9100
spring.datasource.url=jdbc:postgresql://localhost:5432/hms_profile_db
spring.datasource.username=postgres
spring.datasource.password=admin123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
DOCTOR_NOT_FOUND=Doctor not found
DOCTOR_ALREADY_EXISTS=Doctor already exists

PATIENT_NOT_FOUND=Patient not found
PATIENT_ALREADY_EXISTS=Patient already exists


spring.output.ansi.enabled=always

# ===========================
# Swagger / OpenAPI (temporary, for API discovery during benchmarking)
# Off by default. Enable with env SWAGGER_ENABLED=true, then open
# http://<host>:<service-port>/swagger-ui.html  (JSON: /v3/api-docs)
# ===========================
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# ===========================
# Actuator (benchmark observability: /actuator/metrics/hikaricp.connections.active etc.)
# Protected by the same X-Secret-Key rule as every other path of this service.
# ===========================
management.endpoints.web.exposure.include=health,info,metrics
